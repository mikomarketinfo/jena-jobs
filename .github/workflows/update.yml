name: Обновить вакансии и сайт

on:
  schedule:
    - cron: "17 4 * * *"   # каждый день ~06:17 по Берлину (летом; зимой ~05:17)
  workflow_dispatch:        # ручной запуск: вкладка Actions → Run workflow
  push:
    branches: [main]
    paths-ignore: ["data/**", "lebenslauf/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Собрать вакансии
        if: github.event_name != 'push'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Сохранить данные в репозиторий
        if: github.event_name != 'push'
        run: |
          git config user.name "jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Вакансии: обновление $(date -u +%F)"
          git push

      - name: Подготовить сайт (без Lebenslauf)
        run: |
          mkdir -p _site
          cp -r index.html assets config data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
