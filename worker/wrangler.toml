# Мост «Anschreiben с ИИ» (Cloudflare Workers AI)
name = "jena-jobs-bridge"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "STORE"
id = "92d6ee10c4b742df89ba1659f4d30f5c"

[vars]
# откуда разрешены запросы (через запятую)
ALLOWED_ORIGINS = "https://mikomarketinfo.github.io"

# Пароль моста — секрет BRIDGE_PASSWORD (не здесь!).
# Его выставляет workflow .github/workflows/worker.yml из секрета репозитория BRIDGE_PASSWORD,
# или вручную: Cloudflare → Worker → Settings → Variables and Secrets → Add → Secret.
