name: Выложить мост ИИ (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверить секреты
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PASS: ${{ secrets.BRIDGE_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Нет секрета CLOUDFLARE_API_TOKEN — выкладка пропущена"; echo "ok=false" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -z "$PASS" ]; then echo "::warning::Нет секрета BRIDGE_PASSWORD — выкладка пропущена"; echo "ok=false" >> $GITHUB_OUTPUT; exit 0; fi
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Выложить Worker
        id: wr
        if: steps.check.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4d7b394334d28ee8c87cc6d1a6e580b6
          workingDirectory: worker

      - name: Записать пароль моста в Worker
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d7b394334d28ee8c87cc6d1a6e580b6
          BRIDGE_PASSWORD: ${{ secrets.BRIDGE_PASSWORD }}
        run: printf '%s' "$BRIDGE_PASSWORD" | npx --yes wrangler@3 secret put BRIDGE_PASSWORD

      - name: Записать ключ Jooble в Worker
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d7b394334d28ee8c87cc6d1a6e580b6
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: |
          if [ -z "$JOOBLE_KEY" ]; then echo "Нет JOOBLE_KEY — пропуск"; exit 0; fi
          printf '%s' "$JOOBLE_KEY" | npx --yes wrangler@3 secret put JOOBLE_KEY

      - name: Записать адрес моста для сайта
        if: steps.check.outputs.ok == 'true'
        env:
          URL: ${{ steps.wr.outputs.deployment-url }}
          OUT: ${{ steps.wr.outputs.command-output }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$URL" ]; then URL=$(printf '%s' "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1); fi
          echo "Адрес моста: $URL"
          if [ -z "$URL" ]; then echo "::warning::Адрес не найден в выводе wrangler"; exit 0; fi
          printf '{"url": "%s"}\n' "$URL" > config/bridge.json
          git config user.name "jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/bridge.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Адрес моста ИИ: $URL"
          git pull --rebase -q origin main && git push
          gh workflow run update.yml --ref main || true
