name: Cloudflare — вернуть round-forest-2940 к версии 3 (сайт книги)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Откат на версию 7d3fdcaf (7 октября, загружена через дашборд)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: 4d7b394334d28ee8c87cc6d1a6e580b6
        run: |
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/round-forest-2940/deployments" \
            -d '{"strategy":"percentage","versions":[{"version_id":"7d3fdcaf-3c9d-4555-9db0-75f166febf4c","percentage":100}],"annotations":{"workers/message":"Rollback: restore book site (version 3)"}}' > r.json
          python3 -c "import json;r=json.load(open('r.json'));print(json.dumps({'success':r.get('success'),'errors':r.get('errors'),'deployment':(r.get('result') or {}).get('id'),'versions':(r.get('result') or {}).get('versions')}))" | tee data/cf_rollback.json
          git config user.name "jobs-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cf_rollback.json && git commit -m "Cloudflare: откат round-forest-2940" && git pull --rebase -q origin main && git push || true
